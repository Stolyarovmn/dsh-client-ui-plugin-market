name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --legacy-peer-deps
      - run: npm test
      - run: npm run test:pack

  dsh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local plugin into isolated DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.1 plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@0.1.7-rc.1 --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "registry-aggregator" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-client-ui-registry-aggregator" /tmp/dsh-config.txt
