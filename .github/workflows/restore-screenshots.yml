name: Restore README screenshots

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message == 'fix: restore README screenshots v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert lossless WebP back to PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 -c "from PIL import Image; Image.open('docs/screenshots/registry-sources.webp').save('docs/screenshots/registry-sources.png','PNG'); Image.open('docs/screenshots/registry-browse.webp').save('docs/screenshots/registry-browse.png','PNG')"
          sed -i 's/registry-sources\.webp/registry-sources.png/g; s/registry-browse\.webp/registry-browse.png/g' README.md
          rm docs/screenshots/registry-sources.webp docs/screenshots/registry-browse.webp
      - name: Commit PNG screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots
          git commit -m "docs: restore README screenshots as PNG"
          git push
